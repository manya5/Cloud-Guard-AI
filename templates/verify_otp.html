{% extends 'layout.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-900">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-white text-center">Verify OTP</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-500 text-white p-3 rounded mb-4 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('verify_otp') }}">
            <div class="mb-4">
                <label class="block text-gray-300 mb-2" for="otp">
                    Enter OTP sent to your phone
                </label>
                <input class="w-full px-3 py-2 bg-gray-700 text-white rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                       type="text" 
                       name="otp" 
                       id="otp" 
                       required 
                       maxlength="6"
                       pattern="\d{6}"
                       placeholder="Enter 6-digit OTP">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition duration-200">
                Verify OTP
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="{{ url_for('login') }}" class="text-blue-400 hover:text-blue-300">
                Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
