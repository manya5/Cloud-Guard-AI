{% extends 'layout.html' %}
{% block content %}
<div class="change-password-section w-[82%] h-screen flex justify-center items-center overflow-hidden">
    <div class="change-password-container h-[96%] w-full p-10 ">
        <h1 class="text-6xl mb-10">Change Password</h1>

        <button class="back-btn absolute top-10 right-20 text-white hover:text-zinc-500 text-6xl"><a href="/settings"><i class="ri-arrow-left-circle-line"></i></a></button>

        <form action="" class="flex flex-col gap-2 w-80">
        <div class="flex flex-col gap-2">
            <label for="current-password">Current Password</label>
            <input class="w-full p-2 rounded-md bg-transparent border-2 border-zinc-700" type="password" placeholder="Current Password">
        </div>
        <div class="flex flex-col gap-2">
            <label for="new-password">New Password</label>
            <input class="w-full p-2 rounded-md bg-transparent border-2 border-zinc-700" type="password" placeholder="New Password">
        </div>
        <div class="flex flex-col gap-2">
            <label for="confirm-password">Confirm New Password</label>
            <input class="w-full p-2 rounded-md bg-transparent border-2 border-zinc-700" type="password" placeholder="Confirm New Password">
        </div>
        <button class="w-full p-2 rounded-md bg-blue-500 text-white mt-4" type="submit">Change Password</button>
        </form>
    </div>
</div>
{% endblock content %}
